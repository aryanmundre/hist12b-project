<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LA Street Vendors</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --sky: #1f9ce4;
      --sky-deep: #1482c8;
      --navy: #0e2a47;
      --paper: #fffdf8;
      --display: "Playfair Display", "Iowan Old Style", Georgia, serif;
      --text: "Source Serif 4", Georgia, serif;
      --label: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bar-h: 52px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--text);
      color: var(--navy);
      background:
        radial-gradient(
          120% 90% at 50% 35%,
          var(--sky) 0%,
          var(--sky-deep) 100%
        ) fixed;
      overflow-x: hidden;
    }

    /* Original umbrella and shadow. */
    #shadow,
    #umbrella {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      pointer-events: none;
    }

    #umbrella {
      z-index: 20;
    }

    #umbrella svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #shadow {
      z-index: 19;
      border-radius: 50%;
      background:
        radial-gradient(
          closest-side,
          rgba(6, 40, 80, .38) 60%,
          rgba(6, 40, 80, 0) 100%
        );
    }

    /* Original navigation panels. */
    #menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      opacity: 0;
      visibility: hidden;
      filter: drop-shadow(0 3px 6px rgba(6, 40, 80, .28));
    }

    #menu a {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 .2rem 8px;
      font-family: var(--label);
      font-weight: 600;
      font-size: clamp(11px, 1.25vw, 14px);
      line-height: 1.15;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink, #fff);
      transition: height .18s ease;
    }

    #menu a svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    #menu a + a::before {
      content: "";
      position: absolute;
      left: -.5px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(14, 42, 71, .35);
    }

    #menu a:hover,
    #menu a:focus-visible,
    #menu a.active {
      height: calc(var(--bar-h) + 8px);
      outline: none;
    }

    #menu a:focus-visible span {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Original cover. */
    .hero {
      position: relative;
      height: 100vh;
      height: 100svh;
    }

    .hero-text {
      position: absolute;
      left: 0;
      right: 0;
      top: 69%;
      text-align: center;
      padding: 0 16px;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: min(8.5vw, 10vh, 5.5rem);
      line-height: 1.05;
      letter-spacing: -.01em;
    }

    .scroll-cue {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-family: var(--label);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .9);
    }

    .scroll-cue svg {
      width: 18px;
      height: 18px;
      animation: bob 1.8s ease-in-out infinite;
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(5px);
      }
    }

    /* Shared editorial layout. */
    main {
      position: relative;
      z-index: 1;
    }

    section.block {
      margin: 0;
      padding:
        clamp(50px, 9vw, 140px)
        max(7vw, calc((100vw - 900px) / 2));
      scroll-margin-top: calc(var(--bar-h) + 32px);
    }

    section.block h2 {
      margin: .3em 0 .45em;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.4rem, 6vw, 5.4rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    section.block h3 {
      margin: 0 0 .55em;
      font-family: var(--display);
      font-size: clamp(1.3rem, 2.8vw, 1.8rem);
      line-height: 1.2;
    }

    section.block p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.65;
    }

    section.block small,
    section.block dt {
      font-family: var(--label);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    /* About — newspaper-style opening. */
    .section-about {
      background: #fff7e7;
    }

    .lede:first-letter {
      float: left;
      padding: .08em .09em 0 0;
      font-size: 3.8em;
      line-height: .9;
      color: #9b392a;
    }

    .about-copy {
      max-width: 68ch;
    }

    .about-copy p + p {
      margin-top: 1em;
    }

    .section-about p.about-question {
      margin: 1.6rem 0;
      padding-left: 1rem;
      border-left: 3px solid #9b392a;
      font-family: var(--display);
      font-size: clamp(1.3rem, 3vw, 1.85rem);
      line-height: 1.35;
    }

    .about-links {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem 1.5rem;
      margin-top: 1.5rem;
    }

    .section-about a,
    .timeline a {
      color: inherit;
      font-family: var(--label);
      font-weight: 600;
      text-underline-offset: .25em;
    }

    /* People — expandable perspectives. */
    .section-people {
      background: #d9ebdb;
    }

    .section-people details {
      border-bottom: 1px solid #779585;
      padding: 1em 0;
    }

    .section-people summary {
      cursor: pointer;
      font-family: var(--label);
      font-size: 1.25rem;
      font-weight: 600;
    }

    .section-people summary:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }

    .section-people details p {
      padding: .6em 0 0 1.2em;
    }

    /* Why It Matters — side-by-side comparison. */
    .section-matters {
      background: #f7c955;
    }

    .split {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    }

    .split article {
      padding: 1.4em;
      background: #fff4d8;
    }

    .split article + article {
      background: #3b3029;
      color: white;
    }

    .section-org-history {
      background: #f1e7df;
    }

    .section-org-history > p {
      max-width: 68ch;
    }

    .timeline {
      margin: 2rem 0 0;
      padding: 0;
      list-style: none;
    }

    .timeline li {
      display: grid;
      grid-template-columns: 5rem minmax(0, 1fr);
    }

    .timeline time {
      padding-top: .16rem;
      color: #85382f;
      font-family: var(--label);
      font-weight: 700;
    }

    .timeline-entry {
      position: relative;
      padding: 0 0 1.8rem 1.35rem;
      border-left: 1px solid #b1867d;
    }

    .timeline-entry::before {
      content: '';
      position: absolute;
      top: .45rem;
      left: -.3rem;
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
      background: #85382f;
    }

    .timeline li:last-child .timeline-entry {
      padding-bottom: 0;
    }

    .timeline a {
      display: inline-block;
      margin-top: .45rem;
      font-size: .85rem;
    }

    /* Interviews — dark feature section. */
    .section-interviews {
      background: #182933;
      color: #fff9eb;
    }

    .interview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 1.25rem;
      margin-top: 1.75rem;
    }

    .interview-card {
      min-width: 0;
      background: #223743;
      border: 1px solid #536975;
      border-radius: .75rem;
      overflow: hidden;
    }

    .interview-card .interview-window {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #0e1b23;
    }

    .interview-window small {
      padding: 1rem;
      text-align: center;
      color: #c9d8de;
    }

    .interview-description {
      padding: 1.25rem;
    }

    .interview-card a {
      display: inline-block;
      margin-top: .75rem;
      color: #ffe095;
      text-underline-offset: .2em;
    }

    /* Sources — compact reference index. */
    .section-sources {
      background: #f2f0e9;
    }

    .works-cited {
      display: grid;
      gap: 1rem;
      margin: 1.5rem 0 2.5rem;
      padding: 0;
      list-style: none;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .works-cited li {
      padding-left: 1.25em;
      text-indent: -1.25em;
    }

    .works-cited a {
      color: inherit;
      font-weight: 600;
      text-underline-offset: .18em;
      text-decoration-color: #657786;
    }

    .works-cited a:hover {
      color: #9b392a;
      text-decoration-color: currentColor;
    }

    .section-sources dl {
      display: grid;
      grid-template-columns: auto 1fr;
    }

    .section-sources dt,
    .section-sources dd {
      margin: 0;
      padding: 1rem .4rem;
      border-top: 1px solid #9d9b92;
    }

    .section-sources dd {
      overflow-wrap: anywhere;
    }

    @media (max-width: 520px) {
      #menu a {
        font-size: clamp(9px, 2.65vw, 11px);
        letter-spacing: .02em;
      }

      .timeline li {
        grid-template-columns: 3.3rem minmax(0, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .scroll-cue svg {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="shadow" aria-hidden="true"></div>

  <div id="umbrella" aria-hidden="true">
    <svg viewBox="-100 -100 200 200" id="umbrella-svg"></svg>
  </div>

  <nav id="menu" aria-label="Main"></nav>

  <header class="hero" id="top">
    <div class="hero-text" id="hero-text">
      <h1>LA Street Vendors</h1>
    </div>

    <div class="scroll-cue" id="scroll-cue">
      <span>Scroll</span>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 9l7 7 7-7"/>
      </svg>
    </div>
  </header>

  <main id="content"></main>

  <template id="interview-card">
    <article class="interview-card">
      <div class="interview-window"><small></small></div>
      <div class="interview-description">
        <h3></h3>
        <p></p>
      </div>
    </article>
  </template>

  <script>
    (() => {
      // Add the hosted player URL and direct watch link when each video is ready.
      const INTERVIEWS = [
        {
          name: 'Doug Smith',
          description: 'Inclusive Action for the City co-founded the LA Street Vendor Campaign. Smith brings a policy and legal perspective to the campaign.',
          status: 'Recording to be added',
          embedUrl: '',
          watchUrl: ''
        },
        {
          name: 'Second interview',
          description: 'Interviewee and affiliation to be confirmed.',
          status: 'Recording to be added',
          embedUrl: '',
          watchUrl: ''
        }
      ];

      // Keep the original section IDs so previously shared links still work.
      const SECTIONS = [
        {
          id: 'history',
          title: 'About',
          color: '#e6332a',
          ink: '#fff',
          className: 'section-about',
          html: `
            <small>HIST 12B · LOS ANGELES</small>

            <h2>Who gets to make a living on LA’s sidewalks?</h2>

            <div class="about-copy">
              <p class="lede">
                Stand beside a fruit cart for a moment. A customer pauses to order, a pedestrian passes,
                and the vendor makes room for both. This corner is also a workplace. Finding a place to
                set up and building a base of regular customers are part of making a living there.
                City rules help determine where that work can happen and what it takes to keep doing it.
              </p>
              <p>
                This project follows Inclusive Action for the City, a Los Angeles nonprofit that
                helped found the LA Street Vendor Campaign alongside vendors and other community
                organizations. The coalition organized for years to end criminal penalties for sidewalk
                vending and give vendors a way to operate legally. Its work also shows what happens
                after a law changes. Vendors still have to navigate permits, and those who sell food
                have to meet health and equipment requirements. The coalition documented these barriers
                in its <a href="https://inclusiveaction.org/wp-content/uploads/2025/07/Unfinished_Business_Report_6_2021.pdf">Unfinished Business report</a>.
              </p>
              <p>
                For HIST 12B, street vending offers a way to study neoliberalism at the scale of a
                single workplace. Running a cart means taking on the risks of self-employment.
                Organizing gives vendors a way to shape some of the rules behind those risks together.
                We look at what the campaign won and where the cost and paperwork of running a business
                still fall on individual vendors.
              </p>
              <p class="about-question">
                After decriminalization, what does it take to turn the legal right to vend into a stable livelihood?
              </p>
              <div class="about-links">
                <a href="#org-history">Explore the organization’s history</a>
                <a href="#voices">Jump to interviews</a>
              </div>
            </div>
          `
        },
        {
          id: 'vendors',
          title: 'People',
          color: '#ffd400',
          ink: '#0e2a47',
          className: 'section-people',
          html: `
            <h2>Who Shares the Sidewalk?</h2>

            <p>
              Choose a perspective to see how one corner
              serves different people.
            </p>

            <details open>
              <summary>The vendor</summary>
              <p>
                For the person slicing fruit, the corner is a
                workplace. Regular customers know where to find
                the cart.
              </p>
            </details>

            <details>
              <summary>The customer</summary>
              <p>
                For someone walking to work, the same cart can
                be a familiar breakfast stop.
              </p>
            </details>

            <details>
              <summary>Neighbors and shopkeepers</summary>
              <p>
                A parent with a stroller needs a clear path.
                A shopkeeper needs customers to reach the doorway.
              </p>
            </details>

            <details>
              <summary>Officials and organizers</summary>
              <p>
                Public officials shape where vending can take place.
                Vendors and community groups bring their experience
                of the sidewalk into those decisions.
              </p>
            </details>
          `
        },
        {
          id: 'map',
          title: 'Why It Matters',
          color: '#3aaa35',
          ink: '#fff',
          className: 'section-matters',
          html: `
            <h2>
              What changes when a cart moves one block?
            </h2>

            <div class="split">
              <article>
                <h3>For a passerby</h3>
                <p>
                  The detour might add a minute to a walk.
                </p>
              </article>

              <article>
                <h3>For a vendor</h3>
                <p>
                  Will the morning regulars find the new corner?
                  How many sales might move with the cart?
                </p>
              </article>
            </div>
          `
        },
        {
          id: 'org-history',
          title: 'History',
          color: '#00a99d',
          ink: '#0e2a47',
          className: 'section-org-history',
          html: `
            <h2>Inclusive Action for the City</h2>
            <p>
              Inclusive Action grew out of local work on economic inequality and became one of the
              organizations behind the LA Street Vendor Campaign. Here’s how neighborhood organizing
              led to changes in city and state law and how the work continued once permits became available.
            </p>

            <ol class="timeline" role="list">
              <li>
                <time datetime="2008">2008</time>
                <div class="timeline-entry">
                  <h3>Inclusive Action gets its start</h3>
                  <p>A volunteer group comes together to work on economic development in LA’s lower-income neighborhoods. It incorporates in 2009 as the Leadership for Urban Renewal Network, or LURN.</p>
                  <a href="https://inclusiveaction.org/about/">Inclusive Action’s origin story</a>
                </div>
              </li>
              <li>
                <time datetime="2012">2012</time>
                <div class="timeline-entry">
                  <h3>The LA Street Vendor Campaign launches</h3>
                  <p>Organizing in Boyle Heights against police harassment of vendors grows into a citywide campaign. Inclusive Action helps found the coalition, which brings together vendor leaders and community organizations.</p>
                  <a href="https://antidisplacement.org/profile/los-angeles-california-2/">Read the campaign case study</a>
                </div>
              </li>
              <li>
                <time datetime="2017">2017</time>
                <div class="timeline-entry">
                  <h3>Los Angeles decriminalizes sidewalk vending</h3>
                  <p>After years of advocacy, the city moves from criminal penalties to administrative fines for sidewalk vending violations.</p>
                  <a href="https://cityclerk.lacity.org/onlinedocs/2013/13-1493_CA_02-23-2017.pdf">LA City Council’s 2017 decision</a>
                </div>
              </li>
              <li>
                <time datetime="2018">2018</time>
                <div class="timeline-entry">
                  <h3>California changes the law</h3>
                  <p>California enacts SB 946, the Safe Sidewalk Vending Act, decriminalizing sidewalk vending statewide. That November, the Los Angeles City Council adopts an ordinance establishing a local vending program.</p>
                  <a href="https://opportunity.lacounty.gov/state-legislation-sidewalk-vending/">LA County’s overview of SB 946</a>
                  · <a href="https://cityclerk.lacity.org/lacityclerkconnect/index.cfm?cfnumber=13-1493-S5&amp;fa=ccfi.viewrecord">LA City Council records</a>
                </div>
              </li>
              <li>
                <time datetime="2020">2020</time>
                <div class="timeline-entry">
                  <h3>Permits reach the sidewalk</h3>
                  <p>The City of Los Angeles issues its first sidewalk vending permit in January. In December, Inclusive Action and its partners launch a separate pilot to help vendors in unincorporated LA County navigate permits.</p>
                  <a href="https://lastreetvendors.org/">The campaign’s first permit announcement</a>
                  · <a href="https://inclusiveaction.org/sidewalk-vending-programs/">Inclusive Action’s county pilot</a>
                </div>
              </li>
              <li>
                <time datetime="2022">2022</time>
                <div class="timeline-entry">
                  <h3>California revises its food-vending rules</h3>
                  <p>SB 972 updates the state food code to create a category for compact mobile food operations. The change is intended to make health permits more attainable for vendors selling from carts, stands, and similar setups.</p>
                  <a href="https://opportunity.lacounty.gov/state-legislation-sidewalk-vending/">LA County’s overview of SB 972</a>
                </div>
              </li>
              <li>
                <time datetime="2024">2024</time>
                <div class="timeline-entry">
                  <h3>Vendors win a challenge to no-vending zones</h3>
                  <p>Following a lawsuit by vendors and the coalition, Los Angeles repeals no-vending zones in several busy corridors, including the Hollywood Walk of Fame. A settlement provides for canceling citations and issuing refunds.</p>
                  <a href="https://inclusiveaction.org/blog/street-vendors-can-help-la-chart-the-way-forward-after-historic-legal-settlement-heres-how/">Doug Smith on the settlement</a>
                </div>
              </li>
            </ol>
          `
        },
        {
          id: 'voices',
          title: 'Interviews',
          color: '#1d71b8',
          ink: '#fff',
          className: 'section-interviews',
          html: `
            <h2>Interviews</h2>
            <div class="interview-grid"></div>
          `
        },
        {
          id: 'about',
          title: 'Sources',
          color: '#662d91',
          ink: '#fff',
          className: 'section-sources',
          html: `
            <h2>Works Cited</h2>

            <ul class="works-cited" role="list">
              <li><a href="https://inclusiveaction.org/wp-content/uploads/2025/07/Unfinished_Business_Report_6_2021.pdf">Bennett, Cassidy, et al. <cite>Unfinished Business: How Food Regulations Starve Sidewalk Vendors of Opportunity and What Can Be Done to Finish the Legalization of Street Food.</cite> UCLA School of Law Community Economic Development Clinic and Public Counsel, Aug. 2021.</a></li>
              <li><a href="https://cityclerk.lacity.org/lacityclerkconnect/index.cfm?cfnumber=13-1493-S5&amp;fa=ccfi.viewrecord">City of Los Angeles, Office of the City Clerk. “Sidewalk Vending Program, Council File 13-1493-S5.” <cite>Council File Management System</cite>, 2018.</a></li>
              <li><a href="https://inclusiveaction.org/about/">Inclusive Action for the City. “About.”</a></li>
              <li><a href="https://opportunity.lacounty.gov/state-legislation-sidewalk-vending/">Los Angeles County Department of Economic Opportunity. “State Legislation.”</a></li>
              <li><a href="https://antidisplacement.org/profile/los-angeles-california-2/">Small Business Anti-Displacement Network. “LA Street Vendor Campaign – Los Angeles, California.” 2 Sept. 2022.</a></li>
              <li><a href="https://inclusiveaction.org/blog/street-vendors-can-help-la-chart-the-way-forward-after-historic-legal-settlement-heres-how/">Smith, Doug. “Street Vendors Can Help LA Chart the Way Forward After Historic Legal Settlement — Here’s How.” <cite>Inclusive Action for the City</cite>, 26 Aug. 2024.</a></li>
            </ul>

            <dl>
              <dt>Interview</dt>
              <dd>Doug Smith · Inclusive Action</dd>

              <dt>Project</dt>
              <dd>Discussion Group 1O · Teaching Assistant: Lucia Alvarez · Course Instructor: Professor Robin D. G. Kelley · Department of History, UCLA</dd>
            </dl>
          `
        }
      ];

      const N = SECTIONS.length;

      /* Build navigation and editorial sections. */
      const menu = document.getElementById('menu');
      const content = document.getElementById('content');

      SECTIONS.forEach(s => {
        const a = document.createElement('a');
        a.href = '#' + s.id;
        a.style.setProperty('--ink', s.ink);

        a.innerHTML = `
          <svg
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path
              d="M0 0H100V100Q50 68 0 100Z"
              fill="${s.color}"
            />
          </svg>
          <span>${s.title}</span>
        `;

        menu.appendChild(a);

        const sec = document.createElement('section');
        sec.className = 'block ' + s.className;
        sec.id = s.id;
        sec.style.setProperty('--accent', s.color);
        sec.innerHTML = s.html;

        content.appendChild(sec);
      });

      const interviewGrid = content.querySelector('.interview-grid');
      const interviewTemplate = document.getElementById('interview-card');

      INTERVIEWS.forEach(({ name, description, status, embedUrl, watchUrl }) => {
        const card = interviewTemplate.content.cloneNode(true);
        const videoWindow = card.querySelector('.interview-window');
        card.querySelector('h3').textContent = name;
        card.querySelector('p').textContent = description;
        videoWindow.querySelector('small').textContent = status;

        if (embedUrl) {
          const player = document.createElement('iframe');
          player.className = videoWindow.className;
          player.title = `Video interview with ${name}`;
          player.loading = 'lazy';
          player.allowFullscreen = true;
          player.src = embedUrl;
          videoWindow.replaceWith(player);
        }

        if (watchUrl) {
          const link = document.createElement('a');
          link.href = watchUrl;
          link.textContent = `Watch the ${name} interview on the video host`;
          card.querySelector('.interview-description').appendChild(link);
        }

        interviewGrid.appendChild(card);
      });

      /* ----- Draw the umbrella ----- */
      const PANELS = N * 2;
      const R = 100, SAG = 0.9; // fabric dips inward between rib tips
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('umbrella-svg');
      const pt = (deg, r) => {
        const a = deg * Math.PI / 180;
        return [(Math.cos(a) * r).toFixed(2), (Math.sin(a) * r).toFixed(2)];
      };
      const el = (name, attrs) => {
        const n = document.createElementNS(NS, name);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        svg.appendChild(n);
        return n;
      };
      const step = 360 / PANELS;
      for (let i = 0; i < PANELS; i++) {
        const a0 = i * step, a1 = a0 + step;
        const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [cx, cy] = pt(a0 + step / 2, R * SAG);
        // Ordered so the half facing the viewer after the spin matches the menu, left to right.
        el('path', { d: `M0 0 L${x0} ${y0} Q${cx} ${cy} ${x1} ${y1} Z`, fill: SECTIONS[(2 * N - 1 - i) % N].color });
      }
      for (let i = 0; i < PANELS; i++) {
        const [x, y] = pt(i * step, R);
        el('line', { x1: 0, y1: 0, x2: x, y2: y, stroke: 'rgba(14,42,71,.35)', 'stroke-width': .5 });
        el('circle', { cx: x, cy: y, r: 1.1, fill: '#0e2a47' });
      }
      el('circle', { r: 4, fill: '#fffdf8', stroke: '#0e2a47', 'stroke-width': 1 });
      el('circle', { r: 1.3, fill: '#0e2a47' });

      /* ----- Scroll-driven transform ----- */
      const umbrella = document.getElementById('umbrella');
      const shadow = document.getElementById('shadow');
      const heroText = document.getElementById('hero-text');
      const cue = document.getElementById('scroll-cue');
      const links = [...menu.children];
      const blocks = [...content.children];
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      let vw, vh, D, startScale, startY, barH, endTilt;

      function measure() {
        vw = document.documentElement.clientWidth;
        vh = window.innerHeight;
        barH = menu.firstElementChild.offsetHeight || 52;
        // Laid out at its final (largest) size and scaled DOWN for the intro, so it stays crisp.
        D = vw * 1.15;
        const introSize = Math.min(vw * 0.8, vh * 0.52);
        startScale = introSize / D;
        startY = vh * 0.38;
        endTilt = Math.acos(barH / (D / 2)) * 180 / Math.PI;   // edge-on: canopy hangs exactly one bar-height
        for (const n of [umbrella, shadow]) { n.style.width = n.style.height = D + 'px'; }
        update();
      }

      function update() {
        const raw = clamp(window.scrollY / (vh * 0.85), 0, 1);
        const p = ease(raw);

        const scale = lerp(startScale, 1, p);
        const tilt = lerp(0, endTilt, p);
        const spin = reduceMotion ? 0 : lerp(0, 360, p);
        const y = lerp(startY, 0, p);
        const tx = vw / 2 - D / 2, ty = y - D / 2;

        umbrella.style.transform =
          `translate(${tx}px, ${ty}px) rotateX(${tilt}deg) rotateZ(${spin}deg) scale(${scale})`;

        const off = lerp(startScale * D * 0.07, 8, p);
        shadow.style.transform =
          `translate(${tx + off * (1 - p)}px, ${ty + off}px) rotateX(${tilt}deg) scale(${scale * 1.02})`;

        heroText.style.opacity = cue.style.opacity = clamp(1 - raw * 2.2, 0, 1);

        // Hand-off: the flat menu fades in over the edge-on umbrella, then the umbrella drops away.
        const m = clamp((raw - 0.78) / 0.16, 0, 1);
        menu.style.opacity = m;
        menu.style.visibility = m > 0 ? 'visible' : 'hidden';
        const out = 1 - clamp((raw - 0.92) / 0.08, 0, 1);
        umbrella.style.opacity = shadow.style.opacity = out;

        // Highlight the panel for the section being read.
        let current = -1;
        blocks.forEach((b, i) => { if (b.getBoundingClientRect().top < vh * 0.45) current = i; });
        links.forEach((a, i) => a.classList.toggle('active', i === current));
      }

      let ticking = false;
      addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => { ticking = false; update(); });
      }, { passive: true });
      addEventListener('resize', measure);
      measure();
    })();

    /* Section reveals run independently of the umbrella animation. */
    (() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) {
            return;
          }

          const element = entry.target;
          observer.unobserve(element);

          let transform = 'translateY(16px)';

          if (element.matches('article')) {
            transform = 'translateX(-16px)';
          }

          if (element.matches('article:last-child')) {
            transform = 'translateX(16px)';
          }

          element.animate(
            [
              {
                opacity: 0,
                transform
              },
              {
                opacity: 1,
                transform: 'none'
              }
            ],
            {
              duration: 560,
              easing: 'ease-out'
            }
          );
        });
      });

      document
        .querySelectorAll('main h2, .split article')
        .forEach(element => observer.observe(element));
    })();
  </script>
</body>
</html>
